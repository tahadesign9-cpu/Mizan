<style>
:root{
  --bg:#0A1120;--bg2:#0E172A;--card:#121C33;--card2:#17233E;--line:#22304E;--ink:#ECEFF6;--muted:#8B97B2;
  --gold:#D8B26A;--gold2:#F0D8A2;--sal:#3CCAA0;--fr:#A98CF6;--pos:#46D39C;--neg:#FF7C7C;--warn:#F2B35A;
  --shadow:0 22px 44px -26px rgba(0,0,0,.8);--r1:20px;--r2:14px;--r3:9px;
  --display:"Alexandria","IBM Plex Sans Arabic",-apple-system,"Segoe UI",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",-apple-system,"Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;
}
[data-theme=light]{
  --bg:#EDF0F6;--bg2:#E3E8F1;--card:#FFFFFF;--card2:#F4F6FB;--line:#D8DEEA;--ink:#101A2E;--muted:#5C6883;
  --gold:#9A6F1E;--gold2:#7A5616;--sal:#0A8565;--fr:#6643CE;--pos:#11804F;--neg:#C52E2E;--warn:#A86400;
  --shadow:0 22px 44px -30px rgba(16,26,46,.45);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.65;font-variant-numeric:tabular-nums;min-height:100vh}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num,.amt{font-family:var(--display)}
.neg{color:var(--neg)!important}.pos{color:var(--pos)}.muted{color:var(--muted)}

/* shell */
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{align-self:start;background:var(--bg2);border-left:1px solid var(--line);padding:26px 18px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.logo{font-family:var(--display);font-weight:800;font-size:25px;line-height:1.2}
.logo small{display:block;font-family:var(--body);font-weight:500;font-size:12.5px;color:var(--muted);margin-top:4px}
.logo b{color:var(--gold)}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{border:0;background:none;text-align:right;padding:10px 14px;border-radius:var(--r3);cursor:pointer;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:10px}
.nav button i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.nav button:hover{color:var(--ink);background:var(--card)}
.nav button.on{color:var(--ink);background:var(--card)}
.nav button.on i{background:var(--gold)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.side-foot label{font-size:12.5px;color:var(--muted)}
main{padding:30px 34px 70px;min-width:0}
@media (max-width:960px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:14px;gap:12px}
  .nav{flex-direction:row;overflow-x:auto;width:100%;order:3}
  .nav button{white-space:nowrap}
  .side-foot{margin:0;flex-direction:row;flex-wrap:wrap;margin-right:auto}
  main{padding:20px 14px 60px}
}

/* controls */
.btn{border:1px solid var(--line);background:var(--card);border-radius:var(--r3);padding:8px 15px;cursor:pointer;font-weight:600;transition:border-color .15s}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1A1405}
.btn.gold:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 11px;font-size:13px}
.btn.x{border-color:transparent;background:transparent;color:var(--muted);padding:4px 8px}
.btn.x:hover{color:var(--neg)}
.btn.block{width:100%}
select,input[type=text],input[type=number]{background:var(--card2);border:1px solid var(--line);border-radius:var(--r3);padding:8px 10px;min-width:0}
input[type=number]{text-align:center}
input:hover,select:hover{border-color:var(--muted)}

/* header */
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.phead h1{font-family:var(--display);font-size:32px;line-height:1.2;margin:0;font-weight:700}
.phead p{margin:6px 0 0;color:var(--muted);max-width:62ch}
.months{display:grid;grid-template-columns:repeat(12,minmax(70px,1fr));gap:6px;margin-bottom:26px;overflow-x:auto;padding-bottom:4px}
.mo{border:1px solid var(--line);background:var(--card);border-radius:var(--r3);padding:8px 6px 7px;cursor:pointer;text-align:center;display:flex;flex-direction:column;gap:2px}
.mo span{font-weight:700;font-size:13.5px}
.mo small{font-size:11.5px;color:var(--muted);font-family:var(--display)}
.mo.fut{border-style:dashed}

.mo.on{border-color:var(--gold);background:linear-gradient(180deg,rgba(216,178,106,.18),rgba(216,178,106,.04))}
.mo.on span{color:var(--gold)}

/* wallet cards: the signature element */
.wallets{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:22px}
@media (max-width:1100px){.wallets{grid-template-columns:minmax(0,1fr)}}
.wcard{position:relative;overflow:hidden;border-radius:var(--r1);padding:24px 26px 22px;color:#F4F1E8;box-shadow:var(--shadow);border:1px solid rgba(240,216,162,.28);min-height:250px;display:flex;flex-direction:column;gap:12px}
.wcard.salary{background:radial-gradient(120% 90% at 0% 0%,rgba(240,216,162,.16),transparent 55%),linear-gradient(140deg,#106050 0%,#0B3D35 55%,#07211E 100%)}
.wcard.free{background:radial-gradient(120% 90% at 0% 0%,rgba(240,216,162,.16),transparent 55%),linear-gradient(140deg,#4D309D 0%,#2B1B66 55%,#150D35 100%)}
.wcard::before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 110% 120%,rgba(255,255,255,.045) 0 1px,transparent 1px 14px);pointer-events:none}
.wcard>*{position:relative}
.wc-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.wc-name{font-family:var(--display);font-weight:700;font-size:17px;color:#F0D8A2}
.wc-chip{font-size:12px;border:1px solid rgba(240,216,162,.4);border-radius:99px;padding:2px 11px;color:#F0D8A2}
.wc-label{font-size:13px;opacity:.75;margin-top:4px}
.wc-amt{font-family:var(--display);font-weight:800;font-size:46px;line-height:1.05;letter-spacing:0}
.wc-amt small{font-size:16px;font-weight:500;opacity:.7;margin-right:4px}
.wc-amt.neg{color:#FFB0A8!important}
.wc-bar{height:6px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
.wc-bar i{display:block;height:100%;background:linear-gradient(90deg,#F0D8A2,#D8B26A);border-radius:99px}
.wc-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:auto}
.wc-row div{display:flex;flex-direction:column}
.wc-row span{font-size:12px;opacity:.7}
.wc-row b{font-family:var(--display);font-size:16px;font-weight:600}
.wc-input{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wc-input input{width:220px;max-width:100%;background:rgba(0,0,0,.22);border:1px solid rgba(240,216,162,.45);color:#fff;font-family:var(--display);font-size:24px;font-weight:700;padding:8px 14px;text-align:right}
.wc-input input::placeholder{color:rgba(255,255,255,.45)}
.wc-input .btn{background:transparent;color:#F0D8A2;border-color:rgba(240,216,162,.4)}
.wc-note{font-size:12.5px;opacity:.75}
@media (max-width:600px){.wc-amt{font-size:36px}.wc-row{grid-template-columns:1fr 1fr}}

/* panels */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:20px 22px;margin-bottom:20px}
.panel h2{font-family:var(--display);font-size:19px;font-weight:700;margin:0 0 4px}
.panel .hint{color:var(--muted);font-size:13.5px;margin:0 0 14px}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.ph h2{margin:0}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1100px){.cols{grid-template-columns:minmax(0,1fr)}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:16px 18px}
.kpi>span{font-size:13px;color:var(--muted);display:block}
.kpi b{font-family:var(--display);font-size:24px;font-weight:700;display:block;line-height:1.35}
.kpi small{font-size:12.5px;color:var(--muted)}

/* ledger */
.qa{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.qa>*{flex:1 1 120px;min-width:0}.qa>.qname{flex:2 1 220px}.qa>.btn{flex:0 0 auto}.qa>datalist{display:none}

.led{width:100%;border-collapse:collapse}
.led td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.led tr.edge td{background:var(--card2);font-weight:700}
.led tr.edge td:first-child{border-radius:0 var(--r3) var(--r3) 0}
.led tr.edge td:last-child{border-radius:var(--r3) 0 0 var(--r3)}
.led .nm{font-weight:600}
.led .nm small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.led input[type=number]{width:118px}
.led input.auto{color:var(--gold);border-style:dashed}
.led .after{text-align:left;white-space:nowrap;font-family:var(--display);font-weight:600;width:130px}
.led .after .tr{display:block;height:3px;border-radius:9px;background:var(--line);margin-top:5px;overflow:hidden}
.led .after .tr i{display:block;height:100%;background:var(--sal)}
.led.free .after .tr i{background:var(--fr)}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:99px;padding:1px 8px;margin-right:6px;vertical-align:1px}
.tag.need{background:rgba(60,202,160,.14);color:var(--sal)}
.tag.want{background:rgba(242,179,90,.15);color:var(--warn)}
.tag.auto{background:rgba(216,178,106,.15);color:var(--gold)}
.tag.over{background:rgba(255,124,124,.15);color:var(--neg)}
.bud{height:4px;border-radius:9px;background:var(--line);margin-top:6px;overflow:hidden;max-width:180px}
.bud i{display:block;height:100%;background:var(--gold)}
.bud.over i{background:var(--neg)}
.recs{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.rec{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 12px;border-radius:var(--r3);background:var(--card2)}
.rec small{color:var(--muted)}
@media (max-width:600px){.led input[type=number]{width:84px}.led .after{width:92px}.panel{padding:16px 14px}.wcard{padding:20px 18px}}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r2)}

/* 50-30-20 */
.rule{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--line);margin:10px 0}
.rule i{display:block;height:100%}
.rlist{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rlist div{background:var(--card2);border-radius:var(--r3);padding:10px 12px}
.rlist div>span{font-size:12.5px;color:var(--muted);display:block}
.rlist b{font-family:var(--display);font-size:18px}

/* invest */
.inv{border:1px solid rgba(216,178,106,.45);background:linear-gradient(180deg,rgba(216,178,106,.10),rgba(216,178,106,.02));border-radius:var(--r2);padding:20px 22px;margin-bottom:20px}
.inv h2{font-family:var(--display);font-size:19px;margin:0 0 6px;color:var(--gold)}
.alloc{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.al{display:grid;grid-template-columns:1fr auto;gap:2px 12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r3);padding:11px 14px}
.al b{font-family:var(--display);font-size:17px}
.al small{grid-column:1/-1;color:var(--muted);font-size:12.5px}
.note{font-size:12.5px;color:var(--muted);margin:12px 0 0}

/* projects */
.pcard{background:var(--card2);border:1px solid var(--line);border-radius:var(--r2);margin-bottom:12px;overflow:hidden}
.pc-h{display:grid;grid-template-columns:1fr auto auto auto;gap:14px;align-items:center;padding:14px 16px;cursor:pointer}
.pc-h b{font-family:var(--display);font-size:16px}
.pc-h .sub{color:var(--muted);font-size:13px}
.pc-h .val{font-family:var(--display);font-weight:700;text-align:left}
.st{font-size:12px;font-weight:700;border-radius:99px;padding:3px 11px;white-space:nowrap}
.st.done{background:rgba(70,211,156,.15);color:var(--pos)}
.st.part{background:rgba(242,179,90,.15);color:var(--warn)}
.st.none{background:rgba(255,124,124,.13);color:var(--neg)}
.pc-b{border-top:1px solid var(--line);padding:16px;display:grid;gap:16px;background:var(--card)}
.f4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.f4 label input,.f4 label select{width:100%}
.f4 label,.fl{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);font-weight:600}
.f4 label input,.f4 label select{color:var(--ink);font-size:14.5px;font-weight:500}
@media (max-width:800px){.pc-h{grid-template-columns:1fr auto}}
.sec-t{font-family:var(--display);font-weight:600;font-size:14.5px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.line{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:7px}
.line input[type=number]{width:120px}
.line input.who{flex:1 1 140px;min-width:120px}.line input.role{flex:1 1 150px;min-width:120px}
.warn-line{font-size:13px;color:var(--neg);margin-top:4px}
.line .eq{font-family:var(--display);font-weight:600;min-width:110px}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.split div{background:var(--card2);border-radius:var(--r3);padding:10px 12px}
.split div>span{font-size:12px;color:var(--muted);display:block}
.split b{font-family:var(--display);font-size:17px}

<body>
<div class="app">
  <aside class="side" id="side"></aside>

<input type="file" id="importFile" accept="application/json" hidden>
<div class="toast" id="toast" role="status"></div>
<script>
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const KEY='daftar-flousy-v2', OLD='daftar-flousy-v1';
const NOW=new Date(), NY=NOW.getFullYear(), NM=NOW.getMonth();
const PROFILES={cons:{label:'متحفظ',ef:40,cd:40,gold:15,eq:5},bal:{label:'متوازن',ef:30,cd:30,gold:20,eq:20},bold:{label:'جريء',ef:20,cd:20,gold:20,eq:40}};
const ROLES=['ميديا باير','مدير حسابات','مدير مشروع','استراتيجي تسويق','كاتب محتوى','كوبي رايتر','مصمم جرافيك','موشن جرافيك','مونتير','مصور فوتوغرافي','مصور فيديو','مخرج','مدير تصوير','صانع محتوى','موديل','معلق صوتي','مدير سوشيال ميديا','أخصائي سيو','مطور ويب','مبرمج تطبيقات','مسؤول مبيعات'];
const MARKET0={asOfISO:'2026-09-30',asOf:'نهاية سبتمبر 2026',cbe:19,inflation:14.5,core:14.9,coreUp:true,cdVar:19.5,cdFixed:17.75,gold21:6120,goldMonth:-3.2,usd:52,egxYtd:24,next:'29 أكتوبر 2026'};
const PRODUCTS={ef:'صندوق نقدي من بنك أو شركة إدارة أصول، أو حساب توفير بعائد يومي. المهم إنك تسحب في أي وقت.',cd:'شهادة بعائد متغير وصرف شهري، زي البلاتينية المتغيرة في البنك الأهلي. لو الفايدة اترفعت عائدك بيزيد معاها. الشهادات غالبًا بتبدأ من ألف جنيه ومضاعفاتها.',gold:'سبايك صغيرة أو جنيهات ذهب على دفعات شهرية، أو صندوق ذهب لو المبلغ صغير. ابعد عن المشغولات عشان المصنعية.',eq:'صندوق استثمار على مؤشر البورصة المصرية، بمبلغ ثابت كل شهر بدل ما تدخل مرة واحدة.'};
const mkt=()=>Object.assign({},MARKET0,S.market||{});
const MKT_REQ='حدّث بيانات السوق لميزان';
async function refreshMarket(manual){
  if(manual){ui.mkt='loading';render();}
  let got=null;
  try{if(window.claude&&window.claude.use){const db=await window.claude.use('db'); if(db){const snap=await db.doc('market/current').get(); if(snap.exists) got=snap.data();}}}catch(e){}
  const curISO=(S.market&&S.market.asOfISO)||MARKET0.asOfISO||'';
  if(got&&got.cbe&&(got.asOfISO||'')>curISO){S.market=got; save('اتحدثت بيانات السوق: '+got.asOf); ui.mkt=null; render(); return;}
  if(manual){ui.mkt=got?'same':'nodb'; render();}
}
function weights(){
  const M=mkt(),P=PROFILES[st().profile]||PROFILES.bal,w={ef:P.ef,cd:P.cd,gold:P.gold,eq:P.eq},why={};
  const real=M.cdVar-M.inflation;
  why.ef=`أول أولوية لحد ما يغطي ${st().efMonths} شهور من مصاريفك. الصناديق النقدية عائدها قريب من فايدة البنك المركزي ${M.cbe}%.`;
  if(real>=3){w.cd+=10;w.gold-=5;w.eq-=5;why.cd=`الشهادات المتغيرة بتدي ${M.cdVar}% والتضخم ${M.inflation}%، يعني ربح حقيقي حوالي ${real.toFixed(1)}% فوق الغلا. ده أقوى مكان للفلوس دلوقتي.`;}
  else if(real<0){w.cd-=10;w.gold+=10;why.cd=`عائد الشهادات ${M.cdVar}% أقل من التضخم ${M.inflation}%، يعني فلوسك بتخسر قيمتها فيها، فقللنا نصيبها.`;}
  else why.cd=`عائد الشهادات ${M.cdVar}% فوق التضخم ${M.inflation}% بفرق بسيط، فنصيبها متوسط.`;
  if(M.coreUp) why.cd+=` التضخم الأساسي بيطلع ووصل ${M.core}%، فالأفضل العائد المتغير مش الثابت ${M.cdFixed}%.`;
  why.gold=M.goldMonth<0?`عيار 21 نزل ${Math.abs(M.goldMonth)}% الشهر اللي فات ووصل ${fmt(M.gold21)} ج.م، فرصة تشتري على دفعات. الذهب هنا حماية مش ربح سريع.`:`عيار 21 عند ${fmt(M.gold21)} ج.م بعد ما طلع ${M.goldMonth}%، فاشتري بمبالغ صغيرة منتظمة ومتطاردش السعر.`;

function investBox(ax){
  const m=ui.m,s=suggest(ax,m),A=a=>`<div class="alloc">${a.map(p=>`<div class="al"><span>${esc(p.g.name)}</span><b>${fmt(p.amt)}</b><small>${p.note||PRODUCTS[p.g.kind]||''}</small></div>`).join('')}</div>`;
  let contrib='';
  if(ax==='free'){const map={};Y().projects.forEach(p=>{const sp=split(p);payList(p).filter(q=>q.m===m).forEach(q=>{const k=(p.client||'').trim()||'بدون اسم';map[k]=(map[k]||0)+(sp.a?sp.net*q.amt/sp.a:0);});});
    const ks=Object.entries(map).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]);
    if(ks.length) contrib=`<p style="margin:10px 0 0;font-weight:600">الفائض جاي من:</p><div class="ccontrib">${ks.map(([k,v])=>`<div style="--cc:${clientColor(k)}"><span>${esc(k)}</span><b>${fmt(v)}</b></div>`).join('')}</div>`;}
  let body;
  if(s.before<=0){
    const ex=ax==='free'?expectedFree(m):0;
    if(ex>0){const keep=ex*.25;
      body=`<p style="margin:0">لسه مفيش فلوس محصّلة في ${MONTHS[m]}. لما تحصّل مشاريع الشهر، الفائض المتوقع لك <b class="amt">${fmt(ex)}</b> ج.م. هتسيب منه <b class="amt">${fmt(keep)}</b> احتياطي، والباقي يتوزع كده:</p>${A(planFor(ex-keep))}<p class="note">الخطة دي متوقعة، زرار التحويل هيشتغل أول ما تعلّم المشروع «تم التحصيل».</p>`;}
    else body=`<p style="margin:0">${MONTHS[m]} ${s.before<0?`فيه عجز <b class="neg amt">${fmt(-s.before)}</b> ج.م اتغطى من المرحّل`:'مفيهوش فائض'}، فمفيش اقتراح للشهر ده.</p>`;
  }else if(!s.parts.length) body=`<p style="margin:0">فائض ${MONTHS[m]} <b class="amt">${fmt(s.before)}</b> ج.م، ${calc(S.year,ax).cin[m]<0?`بس المحفظة عليها عجز من الشهور اللي فاتت ${fmt(-calc(S.year,ax).cin[m])} ج.م، فالأولوية تسد العجز ده قبل أي استثمار.`:`اتحول منه ${fmt(s.done)} والباقي محجوز هامش أمان.`}</p>`;
  else body=`<p style="margin:0">فائض ${MONTHS[m]} ${ax==='free'?'من كل العملاء ':''}<b class="amt">${fmt(s.before)}</b> ج.م. سيب منه <b class="amt">${fmt(s.keep)}</b> ${ax==='free'?'احتياطي للشهور الضعيفة':'هامش أمان'}${s.done?`، واتحول فعلًا ${fmt(s.done)}`:''}. الباقي يتوزع حسب السوق في ${mkt().asOf}:</p>${A(s.parts)}<button class="btn gold" data-click="apply" data-axis="${ax}">حوّل حسب الاقتراح</button>`;
  return `<div class="inv"><h2>${ax==='free'?'استثمار فائض العمل الحر':'استثمار فائض الراتب'} في ${MONTHS[m]}</h2>${body}<p class="note">اقتراح مبني على أرقامك وحالة السوق، وليس استشارة مالية متخصصة.</p></div>`;
}
function yearTable(ax){
  const c=calc(S.year,ax);
  return `<div class="scroll"><table class="tbl"><thead><tr><th>الشهر</th><th>${ax==='salary'?'الراتب':'صافي المحصّل'}</th><th>المصاريف</th><th>للأهداف</th><th>فائض الشهر لوحده</th><th>مرحّل من قبل</th><th>الإجمالي المتاح</th></tr></thead><tbody>
  ${MONTHS.map((n,i)=>`<tr class="click ${i===ui.m?'sel':''}" data-click="month" data-m="${i}"><td>${n}${future(S.year,i)?' <span class="tag auto">متوقع</span>':''}</td><td class="n">${fmt(c.income[i])}</td><td class="n">${fmt(c.exp[i])}</td><td class="n">${fmt(c.tr[i])}</td><td class="n">${cur(c.surplus[i])}</td><td class="n">${cur(c.cin[i])}</td><td class="n"><b>${cur(c.out[i])}</b></td></tr>`).join('')}
  </tbody><tfoot><tr><td>السنة</td><td class="n">${fmt(sum(c.income))}</td><td class="n">${fmt(sum(c.exp))}</td><td class="n">${fmt(sum(c.tr))}</td><td class="n">${cur(sum(c.surplus))}</td><td></td><td class="n">${cur(c.out[11])}</td></tr></tfoot></table></div>`;
}

function pDash(){
  const m=ui.m,sc=calc(S.year,'salary'),fc=calc(S.year,'free'),cs=clientStats(S.year),due=receivables(S.year);
  const fresh=!+st().defaultSalary&&!Object.values(S.years).some(yy=>yy.projects.length||yy.records.length||yy.salInc.some(v=>v!=null));
  const onb=fresh?`<div class="panel onb"><h2>أهلا بيك في ميزان، ابدأ في 3 خطوات</h2><ol class="steps"><li>اكتب راتبك الثابت والبنود الثابتة زي الإيجار والأقساط <button class="linkbtn" data-click="page" data-p="settings">افتح الإعدادات</button></li><li>سجّل مشاريع الشغل الحر وتيم كل مشروع <button class="linkbtn" data-click="page" data-p="free">افتح العمل الحر</button></li><li>كل شهر افتح الراتب، سجّل مصاريفك، ونفّذ اقتراح الاستثمار</li></ol></div>`:'';
  const al=[];
  ['salary','free'].forEach(ax=>S.cats[ax].forEach(k=>{const t=catTotal(k,ax,S.year,m);if(+k.budget&&t>+k.budget) al.push(['bad',`${esc(k.name)} تخطى ميزانيته في ${MONTHS[m]} بـ ${fmt(t-k.budget)} ج.م`]);}));
  if(due>0) al.push(['',`ليك مستحقات عند العملاء لسه ما اتحصلتش بإجمالي ${fmt(due)} ج.م`]);
  const neg=MONTHS.filter((n,i)=>sc.out[i]<0&&active(S.year,i)); if(neg.length) al.push(['bad',`محفظة الراتب هتبقى بالسالب في ${neg.join('، ')}`]);
  if(cs.list[0]&&cs.list[0].sf>=50) al.push(['bad',`${esc(cs.list[0].name)} لوحده ${Math.round(cs.list[0].sf)}% من دخل العمل الحر، حاول توسع قاعدة عملاءك`]);
  const hasData=Object.values(S.years).some(yy=>yy.projects.length||yy.records.length||yy.salInc.some(v=>v!=null));
  if(hasData&&SYNC.status!=='ok'&&(!S.lastBackup||Date.now()-S.lastBackup>30*864e5)) al.push(['bad',`بياناتك محفوظة في المتصفح بس. ${S.lastBackup?'آخر نسخة احتياطية من أكتر من شهر':'لسه ما خدتش نسخة احتياطية'}، خد واحدة من الإعدادات.`]);
  if(!+st().defaultSalary) al.push(['',`اكتب راتبك الثابت من الإعدادات عشان يتملى أوتوماتيك كل شهر`]);
  if(!al.length) al.push(['good','كله تمام في الشهر ده، مفيش بنود عدت ميزانيتها']);
  const ef=S.goals.find(g=>g.kind==='ef'),eft=ef?goalTarget(ef):0;
  const spend=S.cats.salary.map(k=>({name:k.name,v:catTotal(k,'salary',S.year,m)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  return head('لوحة التحكم',`صورة شاملة لفلوسك في ${MONTHS[m]} ${S.year}. اختار أي شهر من الشريط.`)+`<div style="margin:-10px 0 20px"><button class="btn gold" data-click="report">تقرير ${MONTHS[m]} الكامل</button></div>`+onb+
  `<div class="wallets">${walletCard('salary')}${walletCard('free')}</div>
  <div class="kpis">
   <div class="kpi"><span>دخلك الكلي في السنة</span><b>${fmt(sum(sc.income)+sum(fc.income))}</b><small>راتب ${fmt(sum(sc.income))}، عمل حر ${fmt(sum(fc.income))}</small></div>
   <div class="kpi"><span>متوقع آخر السنة</span><b>${cur(sc.out[11]+fc.out[11])}</b><small>لو الثابت فضل زي ما هو</small></div>
   <div class="kpi"><span>في الأهداف والاستثمار</span><b>${fmt(sum(S.goals.map(goalBal)))}</b><small>${S.goals.length} أهداف</small></div>
   <div class="kpi"><span>صندوق الطوارئ</span><b>${Math.round(pc(ef?goalBal(ef):0,eft))}%</b><small>من هدف ${fmt(eft)} ج.م</small></div>
  </div>
  <div class="cols"><div class="panel"><h2>الدخل شهر بشهر</h2><p class="hint">الراتب قصاد صافي العمل الحر المحصّل فعلًا.</p>${bars([{name:'الراتب',color:'var(--sal)',values:sc.income},{name:'صافي العمل الحر',color:'var(--fr)',values:fc.income}])}</div>
   <div class="panel"><h2>تنبيهات</h2><div class="alerts">${al.map(a=>`<div class="alert ${a[0]}">${a[1]}</div>`).join('')}</div></div></div>
  <div class="cols"><div class="panel"><h2>مصاريف المعيشة في ${MONTHS[m]}</h2>${donut(spend.slice(0,8),'المصاريف')}</div>
   <div class="panel"><h2>أكبر العملاء</h2>${cs.list.length?donut(cs.list.slice(0,6).map(c=>({name:c.name,c:c.color,v:Math.max(0,c.net)})),'صافي العمل الحر'):'<div class="empty">سجل مشاريع في العمل الحر وهتظهر هنا</div>'}</div></div>`;
}

}

   <div class="panel"><h2>حساب ${MONTHS[m]} خطوة بخطوة</h2><p class="hint">الفائض النهائي من العملاء، وبعده مصاريف الشغل وأي مصاريف حياة بتتدفع من هنا.</p>${ledger('free')}</div></div>

/* ---------- downloads ---------- */
async function saveFile(name,data,type){
  try{if(window.claude&&claude.use){const dl=await claude.use('downloads'); if(dl){await dl.save({filename:name,data}); return true;}}}
  catch(e){if(e&&e.code==='declined') return false; toast('التحميل مش متاح هنا'); return false;}
  try{const f=new File([data],name,{type}); if(navigator.canShare&&navigator.canShare({files:[f]})&&/Android|iPhone|iPad/i.test(navigator.userAgent)){await navigator.share({files:[f],title:name}); return true;}}catch(e){if(e&&e.name==='AbortError') return false;}
  const u=URL.createObjectURL(new Blob([data],{type})),l=document.createElement('a');l.href=u;l.download=name;l.click();setTimeout(()=>URL.revokeObjectURL(u),800);return true;
}

const SYNC={db:null,uid:null,status:'local',timer:null,busy:false};
function setSync(st){SYNC.status=st;const el=document.getElementById('syncst');if(el) el.outerHTML=syncBadge();}
function syncBadge(){const m={local:['محفوظ على الجهاز ده بس','var(--muted)'],syncing:['بيزامن مع حسابك...','var(--warn)'],ok:['متزامن مع حسابك','var(--pos)'],error:['المزامنة وقفت، محفوظ على الجهاز','var(--neg)']}[SYNC.status];
  return `<span id="syncst" style="display:flex;align-items:center;gap:7px;font-size:12.5px;color:${m[1]}"><i style="width:8px;height:8px;border-radius:50%;background:${m[1]};display:inline-block"></i>${m[0]}</span>`;}
const cref=k=>SYNC.db.doc(`data/users/${SYNC.uid}/${k}`);
async function initSync(){
  try{if(!(window.claude&&claude.use)) return setSync('local');
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]); if(!db||!user) return setSync('local');
    const uid=await user.id(); if(!uid) return setSync('local');
    SYNC.db=db; SYNC.uid=uid; await pull();
    document.addEventListener('visibilitychange',()=>{if(!document.hidden) pull();});
  }catch(e){setSync('error');}
}
async function pull(){
  if(!SYNC.db||SYNC.busy) return; SYNC.busy=true; setSync('syncing');
  try{const core=await cref('core').get();
    if(!core.exists){ const has=Object.values(S.years).some(yy=>yy.projects.length||yy.records.length||yy.transfers.length||yy.salInc.some(v=>v!=null))||+S.settings.defaultSalary; if(S.updatedAt||has){S.updatedAt=S.updatedAt||Date.now(); try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} await pushAll();} }
    else{const c=core.data();
      if((c.at||0)>(S.updatedAt||0)){const st2=JSON.parse(c.v),yrs={};
        for(const y of (c.years||[])){const d=await cref('y'+y).get(); if(d.exists) yrs[y]=JSON.parse(d.data().v);}
        st2.years=yrs; st2.updatedAt=c.at; S=st2; normalize(); try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} render(); toast('اتجابت آخر بياناتك من حسابك');}
      else if((c.at||0)<(S.updatedAt||0)) await pushAll();}
    setSync('ok');}catch(e){setSync('error');}
  SYNC.busy=false;
}
async function pushAll(){
  const {years,...rest}=S;
  for(const [y,d] of Object.entries(years)) await cref('y'+y).set({v:JSON.stringify(d),at:S.updatedAt||0});
  await cref('core').set({v:JSON.stringify(rest),at:S.updatedAt||0,years:Object.keys(years)});
}
function schedulePush(){ if(!SYNC.db) return; clearTimeout(SYNC.timer); setSync('syncing');
  SYNC.timer=setTimeout(async()=>{if(SYNC.busy){schedulePush();return;} SYNC.busy=true; try{await pushAll(); setSync('ok');}catch(e){setSync('error');} SYNC.busy=false;},1200);}

    case 'tax-pay': {const a=parseFloat(val('tax-amt'))||0; if(a<=0){toast('اكتب المبلغ');return;} S.taxPaid.push({id:uid(),y:S.year,m,amt:a}); msg='اتسجلت دفعة الضرايب'; break;}
    case 'del-tax': S.taxPaid=S.taxPaid.filter(x=>x.id!==d.id); break;
    case 'import': ui.imp='all'; document.getElementById('importFile').click(); return;
    case 'mkt-import': refreshMarket(true); return;
    case 'mkt-file': ui.imp='mkt'; document.getElementById('importFile').click(); return;
    case 'copy-req': {try{navigator.clipboard.writeText(MKT_REQ).then(()=>toast('اتنسخ الطلب'),()=>toast('انسخ الجملة بإيدك'));}catch(e){toast('انسخ الجملة بإيدك');} return;}
    case 'clear-month': {const mm=+val('clr-m'),hard=val('clr-mode')==='hard';
      const pj=y.projects.filter(p=>p.m===mm).length,rc=y.records.filter(r=>r.m===mm).length,tr=y.transfers.filter(t=>t.m===mm).length;
      ask(`مسح بيانات ${MONTHS[mm]} ${S.year}؟ هيتمسح ${pj} مشروع و${rc} مصروف مسجل و${tr} تحويل${hard?'، والراتب والبنود الثابتة هتتصفر في الشهر ده':''}. باقي الشهور مش هتتأثر.`,()=>{
        y.salInc[mm]=hard?0:null;
        Object.keys(y.vals).forEach(k=>{y.vals[k][mm]=null;});
        y.records=y.records.filter(r=>r.m!==mm); y.transfers=y.transfers.filter(t=>t.m!==mm); y.moves=(y.moves||[]).filter(v=>v.m!==mm);
        y.projects=y.projects.filter(p=>p.m!==mm);
        y.projects.forEach(p=>{p.pays=p.pays.filter(q=>q.m!==mm); if(p.status==='done'&&+p.doneM===mm){p.status='none';p.doneM=null;}});
        y.hide=y.hide||{}; Object.keys(y.hide).forEach(k=>y.hide[k]=y.hide[k].filter(x=>x!==mm));
        if(hard) ['salary','free'].forEach(ax=>S.cats[ax].forEach(c=>{if(+c.fixed){(y.hide[c.id]=y.hide[c.id]||[]).push(mm);}}));
        save('اتمسح '+MONTHS[mm]+' بس'); render();});
      return;}
    case 'reset': ask('مسح كل البيانات نهائيًا؟ خد نسخة الأول لو محتاجها.',()=>{S=defState(); save('اتمسح'); render();}); return;
  }
  save(msg); render();
});
document.getElementById('importFile').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f) return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);
    if(ui.imp==='mkt'||d.type==='mizan-market'){const mk=d.market||d; if(!mk.cbe) throw 0; S.market=mk; save('اتحدثت بيانات السوق'); render(); return;}
    if(!d.years) throw 0; ask('الاستيراد هيستبدل البيانات الحالية. تكمل؟',()=>{if(d.v!==2){localStorage.setItem(OLD,JSON.stringify(d));S=migrate()||defState();}else S=d; save('اتستوردت النسخة'); render();});}catch(err){toast('الملف ده مش نسخة من ميزان');}};
  r.readAsText(f);e.target.value='';
});
render();
setTimeout(()=>refreshMarket(false),1500);
initSync();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
